name: Node.js CI

on:
  push:
    branches: ["staging", "feature/add-cicd"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clone Backend Repository
        uses: actions/checkout@v3
        with:
          repository: Devops-Intro-Sami/Devops_Backend
          path: backend

      - name: Set up Docker Compose
        run: |
          sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build and Start Docker Compose Services
        run: |
          docker-compose -f backend/docker-compose_test.yml up --build -d

      - name: Wait for App to be Ready
        run: |
          for i in {1..10}; do
            curl -s http://localhost:3001/ && break || sleep 5
          done

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install dependencies
        run: npm install

      - name: start dev
        run: npm start

      - name: Run tests
        run: npm cypress run
